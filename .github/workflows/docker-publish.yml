name: Publish Docker image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: "11.0.x"

      - name: Run tests
        run: >-
          dotnet test Tests/EnphaseLocal.Tests/EnphaseLocal.Tests.csproj
          --collect:"XPlat Code Coverage"
          --settings Tests/EnphaseLocal.Tests/coverlet.runsettings

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: authored-source-coverage
          path: Tests/EnphaseLocal.Tests/TestResults/**/coverage.cobertura.xml
          if-no-files-found: error

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: EnphaseLocal/Dockerfile
          push: true
          tags: styxut/enphase-local:latest
