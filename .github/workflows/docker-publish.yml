name: Publish Docker image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Run tests
        run: >-
          dotnet test Tests/EnphaseLocal.Tests/EnphaseLocal.Tests.csproj
          --collect:"XPlat Code Coverage"
          --settings Tests/EnphaseLocal.Tests/coverlet.runsettings

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: authored-source-coverage
          path: Tests/EnphaseLocal.Tests/TestResults/**/coverage.cobertura.xml
          if-no-files-found: error

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: EnphaseLocal/Dockerfile
          push: true
          tags: styxut/enphase-local:latest
