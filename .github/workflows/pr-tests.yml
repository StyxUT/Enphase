name: PR tests

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: "11.0.x"

      - name: Run tests
        run: >-
          dotnet test Tests/EnphaseLocal.Tests/EnphaseLocal.Tests.csproj
          --collect:"XPlat Code Coverage"
          --settings Tests/EnphaseLocal.Tests/coverlet.runsettings

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: authored-source-coverage
          path: Tests/EnphaseLocal.Tests/TestResults/**/coverage.cobertura.xml
          if-no-files-found: error
