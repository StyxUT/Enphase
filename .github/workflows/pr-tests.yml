name: PR tests

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Run tests
        run: >-
          dotnet test Tests/EnphaseLocal.Tests/EnphaseLocal.Tests.csproj
          --collect:"XPlat Code Coverage"
          --settings Tests/EnphaseLocal.Tests/coverlet.runsettings

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: authored-source-coverage
          path: Tests/EnphaseLocal.Tests/TestResults/**/coverage.cobertura.xml
          if-no-files-found: error
